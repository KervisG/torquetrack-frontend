# Reenvío a Django (gunicorn). Se incluye en cada location del backend porque
# proxy_set_header no se hereda si la location define alguno propio.
#
# Con una variable, nginx resuelve el host en cada request (con `resolver` y
# su `valid`) y no una sola vez al arrancar: si el backend se reinicia con otra
# IP, el proxy la sigue. Sin URI después del host, la URI del request llega a
# Django tal cual, igual que antes (/api/, /django-admin/ y /static/ no se
# reescriben). No hay keepalive hacia el backend: gunicorn con workers `sync`
# cierra la conexión tras cada respuesta de todos modos.
proxy_pass http://$django_upstream;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# IP de la conexión (sin realip, la del proxy de Render). nginx lo sobrescribe
# siempre, así que un cliente no puede falsificarlo; no identifica al cliente,
# por eso Django usa NUM_PROXIES y no CLIENT_IP_HEADER=HTTP_X_REAL_IP.
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# gunicorn corta a los 60 s (PDF de cotización con WeasyPrint): se espera un
# poco más para devolver su error y no un 504 propio.
proxy_read_timeout 65s;

# Django ya envía nosniff, Referrer-Policy y X-Frame-Options; aquí no se agregan
# para no duplicarlos. Tampoco se comprime: respuestas con el token CSRF junto a
# datos reflejados son el caso de BREACH.
gzip off;
