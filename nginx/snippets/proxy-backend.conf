# Reenvío a Django (gunicorn). Se incluye en cada location del backend porque
# proxy_set_header no se hereda si la location define alguno propio.
proxy_pass http://django;
proxy_http_version 1.1;
# Vacío para reutilizar las conexiones keepalive del upstream.
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# IP real del cliente tras realip. nginx lo sobrescribe siempre, así que un
# cliente no puede falsificarlo; Django lo lee con CLIENT_IP_HEADER=HTTP_X_REAL_IP.
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# gunicorn corta a los 60 s (PDF de cotización con WeasyPrint): se espera un
# poco más para devolver su error y no un 504 propio.
proxy_read_timeout 65s;

# Django ya envía nosniff, Referrer-Policy y X-Frame-Options; aquí no se agregan
# para no duplicarlos. Tampoco se comprime: respuestas con el token CSRF junto a
# datos reflejados son el caso de BREACH.
gzip off;
