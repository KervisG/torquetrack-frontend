# Solo para las respuestas del SPA. Se incluye por location porque un
# add_header dentro de la location anula los heredados del server, y las
# respuestas de Django ya traen los suyos.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
